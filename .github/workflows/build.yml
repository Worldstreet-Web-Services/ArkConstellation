name: Build Release Binary
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - base-genesis
  pull_request:
    branches:
      - main
      - base-genesis

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build Binary
        run: |
          make build
          sha256sum build/mantrachaind > build/sha256sum.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: chain-binary
          path: build/

  validate-genesis:
    runs-on: ubuntu-latest
    needs: build  # waits for build job to complete successfully
    steps:
      - uses: actions/checkout@v4
      - name: Download compiled binary
        uses: actions/download-artifact@v4
        with:
          name: chain-binary
          path: build/
      - name: Install libwasmvm
        run: |
          WASMVM_VERSION=$(grep "github.com/CosmWasm/wasmvm" go.mod | head -n 1 | awk '{print $2}')
          echo "Installing libwasmvm ${WASMVM_VERSION}..."
          sudo wget "https://github.com/CosmWasm/wasmvm/releases/download/${WASMVM_VERSION}/libwasmvm.x86_64.so" -O /lib/libwasmvm.x86_64.so
          sudo chmod +x /lib/libwasmvm.x86_64.so
      - name: Make binary executable
        run: chmod +x build/mantrachaind
      - name: Validate genesis files
        run: |
          found=0
          for dir in networks/*/; do
            if [ -f "$dir/genesis.json" ]; then
              echo "Validating $dir/genesis.json..."
              ./build/mantrachaind genesis validate-genesis "$dir/genesis.json"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No genesis.json files found yet — skipping validation."
          fi
