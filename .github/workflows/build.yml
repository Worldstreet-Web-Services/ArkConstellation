name: Build Release Binary
on:
  push:
    tags:
      - 'v*'
      - 'ark-v*'
    branches:
      - main
      - base-genesis
  pull_request:
    branches:
      - main
      - base-genesis

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build Binary
        run: |
          make build
          sha256sum build/arkd > build/sha256sum.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: chain-binary
          path: build/

  validate-genesis:
    runs-on: ubuntu-latest
    needs: build  # waits for build job to complete successfully
    steps:
      - uses: actions/checkout@v4
      - name: Download compiled binary
        uses: actions/download-artifact@v4
        with:
          name: chain-binary
          path: build/
      - name: Make binary executable
        run: chmod +x build/arkd build/mantrachaind 2>/dev/null || chmod +x build/arkd
      - name: Install libwasmvm shared library
        # The binary is dynamically linked against libwasmvm (CosmWasm) but the
        # `build` job never installs it on the runner, so any attempt to execute
        # the downloaded binary fails with "libwasmvm.x86_64.so: cannot open
        # shared object file". Pull the exact version pinned in go.mod and drop
        # it on the linker path before we try to run the binary.
        run: |
          # Match any wasmvm major (v2 -> v3 happened once already; don't
          # silently break again on the next bump) and fail loudly if the
          # pattern stops matching rather than curl-ing an empty version.
          WASMVM_VERSION=$(grep -E 'github.com/CosmWasm/wasmvm/v[0-9]+ ' go.mod | awk '{print $2}')
          if [ -z "$WASMVM_VERSION" ]; then
            echo "::error::could not determine wasmvm version from go.mod" >&2
            exit 1
          fi
          echo "Installing libwasmvm ${WASMVM_VERSION}"
          sudo curl -fsSL -o /usr/lib/x86_64-linux-gnu/libwasmvm.x86_64.so \
            "https://github.com/CosmWasm/wasmvm/releases/download/${WASMVM_VERSION}/libwasmvm.x86_64.so"
          sudo ldconfig
      - name: Validate genesis files
        # This step looked only for networks/*/genesis.json, which has never
        # existed in this repo, so it printed "skipping" and passed without
        # inspecting anything. Validate the complete genesis files that are
        # actually here, and fail rather than skip if the list is ever empty
        # again. networks/devnet/genesis-template.json is deliberately absent:
        # it is a JSON-merge-patch overlay, not a genesis file (see its
        # _comment), and is covered by the genesis-sync job instead.
        run: |
          files=""
          for f in networks/*/genesis.json networks/mainnet/genesis-DRAFT.json; do
            if [ -f "$f" ]; then
              files="$files $f"
            fi
          done
          if [ -z "$files" ]; then
            echo "::error::no complete genesis file matched - this check must never pass vacuously" >&2
            exit 1
          fi
          for f in $files; do
            echo "Validating $f ..."
            ./build/arkd genesis validate-genesis "$f"
          done

  genesis-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Devnet genesis patch drift check
        # genesis-template.json and pystarport.json carry the same merge patch
        # in two places, and nothing but this script stops them from applying
        # different parameters than the ones a human reviewed. `make devnet-init`
        # depends on it locally; until now nothing ran it on a pull request.
        run: python3 networks/devnet/check-genesis-sync.py
