# This workflow creates a release using goreleaser
name: Create release

on:
  push:
    tags:
      - "v*.*.*"
      - "ark-v*.*.*"
      - "ark-v*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "The desired tag for the release (e.g. v0.1.0)."
        required: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: write
  attestations: write       # added (to publish provenance)
  id-token: write           # (required for OIDC token used by attest-build-provenance)

jobs:
  verify-security-gate:
    name: Verify Eng 3 Security & Chaos Sign-Off
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Eng 3 Release Gate Verification
        run: |
          python3 scripts/release/verify-eng3-signoff.py "${{ github.event.inputs.release_tag || github.ref_name }}"

  build:
    name: Build - ${{ matrix.platform.name }}
    needs: [verify-security-gate]
    runs-on: ${{ matrix.platform.runner || 'chain-runner' }}
    strategy:
      matrix:
        platform:
          - name: Linux x86_64
            ids: arkd-linux-amd64
            runner: ubuntu-latest
            cross: false
          - name: Linux aarch64
            ids: arkd-linux-arm64
            runner: ubuntu-24.04-arm
            docker-platform: linux/arm64
            cross: false
          - name: MacOS x86_64 and aarch64
            ids: arkd-darwin-amd64,arkd-darwin-arm64
            runner: ubuntu-latest
            cross: true

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Checkout Git repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Go modules
        run: |
          go mod download || (sleep 5 && go mod download)
        env:
          GO111MODULE: "on"
          GOPROXY: "https://proxy.golang.org,direct"
        continue-on-error: true
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Make goreleaser build
        run: |
          make goreleaser-build-local
        env:
          GORELEASER_IDS: ${{ matrix.platform.ids }}
          GORELEASER_CROSS_DISABLE: ${{ !matrix.platform.cross }}
          GORELEASER_PLATFORM: ${{ matrix.platform.docker-platform || 'linux/amd64' }}
          GORELEASER_SNAPSHOT: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          GO111MODULE: "on"
          GOPROXY: "https://proxy.golang.org,direct"
          GOSUMDB: "sum.golang.org"

      - name: Install rcodesign
        if: matrix.platform.cross == true && github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          RCVER="0.29.0"
          curl -fsSL -o /tmp/rcodesign.tar.gz \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCVER}/apple-codesign-${RCVER}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/rcodesign.tar.gz -C /tmp
          sudo install -m0755 "$(find /tmp -name rcodesign -type f | head -1)" /usr/local/bin/rcodesign
          rcodesign --version

      - name: Sign and notarize macOS binaries
        if: matrix.platform.cross == true && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ASC_API_KEY_JSON_BASE64: ${{ secrets.APPLE_ASC_API_KEY_JSON_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          WORK="$(mktemp -d)"
          echo "$APPLE_DEVELOPER_ID_P12_BASE64"   | base64 -d > "$WORK/dev-id.p12"
          printf '%s' "$APPLE_DEVELOPER_ID_P12_PASSWORD" > "$WORK/p12-pw.txt"
          echo "$APPLE_ASC_API_KEY_JSON_BASE64"   | base64 -d > "$WORK/asc-api-key.json"

          shopt -s nullglob
          found=0
          for bin in dist/*darwin*/arkd; do
            found=1
            echo "::group::sign+notarize $bin"
            rcodesign sign \
              --p12-file "$WORK/dev-id.p12" \
              --p12-password-file "$WORK/p12-pw.txt" \
              --code-signature-flags runtime \
              "$bin"

            zip="$WORK/$(basename "$(dirname "$bin")").zip"
            ( cd "$(dirname "$bin")" && zip -q -X "$zip" arkd )

            rcodesign notary-submit \
              --api-key-file "$WORK/asc-api-key.json" \
              --wait \
              "$zip"

            rcodesign verify "$bin"
            echo "::endgroup::"
          done
          rm -rf "$WORK"
          if [ "$found" -eq 0 ]; then
            echo "ERROR: no darwin binaries found to sign under dist/*darwin*/" >&2
            exit 1
          fi

      - name: Store artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ matrix.platform.name }}
          path: dist/*/
          retention-days: 1

  release:
    if: github.event_name != 'pull_request'
    name: Create release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      # Download all artifacts
      - uses: actions/download-artifact@v4
        with:
          path: dist-merged
          pattern: release-${{ github.sha }}-*
          merge-multiple: true
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Import GPG key
        id: gpg-import
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.MANTRACHAIN_GPG_PRIVATE_KEY }}" ]; then
            if echo "${{ secrets.MANTRACHAIN_GPG_PRIVATE_KEY }}" | base64 -d 2>/dev/null | gpg --batch --import 2>/dev/null; then
              echo "has_gpg=true" >> "$GITHUB_OUTPUT"
              gpg --list-secret-keys --keyid-format=long || true
            elif echo "${{ secrets.MANTRACHAIN_GPG_PRIVATE_KEY }}" | gpg --batch --import 2>/dev/null; then
              echo "has_gpg=true" >> "$GITHUB_OUTPUT"
              gpg --list-secret-keys --keyid-format=long || true
            else
              echo "GPG import failed, will skip signing"
              echo "has_gpg=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No GPG key provided, will skip signing"
            echo "has_gpg=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Make release
        run: |
          make release
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_SKIP: ${{ steps.gpg-import.outputs.has_gpg == 'true' && 'validate' || 'validate,sign' }}
          GORELEASER_CONFIG: ./scripts/ci-goreleaser/.goreleaser.yaml
          GPG_PASSWORD: ${{ secrets.MANTRACHAIN_GPG_PASSPHRASE }}
          GPG_FINGERPRINT: ${{ vars.MANTRACHAIN_GPG_FINGERPRINT }}
      - name: Generate SLSA provenance
        uses: actions/attest-build-provenance@v3
        continue-on-error: true
        with:
          subject-path: |
            dist/*/arkd*
            dist/*.tar.gz
            dist/sha256sum.txt*
