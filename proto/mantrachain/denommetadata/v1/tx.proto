syntax = "proto3";

package mantrachain.denommetadata.v1;

import "cosmos/bank/v1beta1/bank.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/MANTRA-Chain/mantrachain/v8/x/denommetadata/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // SetDenomMetadata defines a (governance) operation for setting bank denom
  // metadata on denominations that have none, or whose metadata is incomplete.
  //
  // Its purpose is IBC-derived denominations. ICS-20 does not carry denom
  // metadata across the wire, so a receiving chain synthesises it, and what it
  // synthesises has a `display` naming a unit absent from `denom_units`. Any
  // consumer deriving decimals from that metadata gets 0 — including the
  // x/erc20 module, whose deployed ERC-20 contracts then report decimals() = 0
  // for tokens that are not 0-decimal.
  rpc SetDenomMetadata(MsgSetDenomMetadata) returns (MsgSetDenomMetadataResponse);
}

// MsgSetDenomMetadata sets bank denom metadata for one or more denominations.
message MsgSetDenomMetadata {
  option (cosmos.msg.v1.signer) = "authority";

  // authority is the address permitted to set metadata; normally the gov module.
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // metadata to write. Each entry's `base` identifies the denomination.
  repeated cosmos.bank.v1beta1.Metadata metadata = 2
      [ (gogoproto.nullable) = false ];
}

// MsgSetDenomMetadataResponse defines the response type.
message MsgSetDenomMetadataResponse {}
