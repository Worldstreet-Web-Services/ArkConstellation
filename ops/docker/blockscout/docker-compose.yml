version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: blockscout-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-blockscout}
    volumes:
      - blockscout-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-blockscout}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: blockscout-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  smart-contract-verifier:
    image: ghcr.io/blockscout/smart-contract-verifier:latest
    container_name: blockscout-verifier
    restart: unless-stopped
    environment:
      SMART_CONTRACT_VERIFIER__SERVER__HTTP__ADDR: 0.0.0.0:8050
    ports:
      - "127.0.0.1:8050:8050"

  backend:
    image: ghcr.io/blockscout/blockscout:latest
    container_name: blockscout-backend
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - bin/blockscout eval "Elixir.Explorer.ReleaseTasks.create_and_migrate()" && bin/blockscout start
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Chain & RPC configuration
      ETHEREUM_JSONRPC_VARIANT: ${ETHEREUM_JSONRPC_VARIANT:-geth}
      ETHEREUM_JSONRPC_HTTP_URL: ${ETHEREUM_JSONRPC_HTTP_URL:-http://host.docker.internal:8545}
      ETHEREUM_JSONRPC_WS_URL: ${ETHEREUM_JSONRPC_WS_URL:-}
      CHAIN_ID: ${CHAIN_ID:-9000}
      COIN: ${COIN:-KASH}
      COIN_NAME: ${COIN_NAME:-KASH}
      DISPLAY_DECIMALS: ${DISPLAY_DECIMALS:-18}
      DECIMALS: ${DECIMALS:-18}
      NETWORK: ${NETWORK:-ArkConstellation Devnet}
      SUBNETWORK: ${SUBNETWORK:-arkdevnet_9000-1}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-56NtB48gahikqTXWMytxxdMgXKZwtGe6PYLrhzbXxWayXBWh1rznH995yt3zkNu2}
      CHECK_ENDPOINT: "false"
      DISABLE_INDEXER: "false"
      
      # Database & Cache
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-blockscout}
      ECTO_USE_SSL: "false"
      REDIS_URL: redis://redis:6379/0

      # Cosmos-EVM Tuning
      INDEXER_DISABLE_BLOCK_REWARD_FETCHER: "true"
      INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER: ${INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER:-true}
      INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: "true"
      INDEXER_DISABLE_CATCHUP_BLOCK_REWARDS: "true"
      DISABLE_TOKEN_INSTANCE_FETCH: "false"
      
      # Smart Contract Verifier Integration
      SMART_CONTRACT_VERIFIER_HTTP_URL: http://smart-contract-verifier:8050
      
      # Service ports
      PORT: "4000"
    ports:
      - "${BACKEND_PORT:-4000}:4000"

  frontend:
    image: ghcr.io/blockscout/frontend:latest
    container_name: blockscout-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: "3000"
      NEXT_PUBLIC_API_BASE_PATH: /
      NEXT_PUBLIC_API_HOST: localhost
      NEXT_PUBLIC_API_PORT: "4000"
      NEXT_PUBLIC_API_PROTOCOL: http
      NEXT_PUBLIC_APP_HOST: localhost
      NEXT_PUBLIC_APP_PORT: "3000"
      NEXT_PUBLIC_APP_PROTOCOL: http
      NEXT_PUBLIC_NETWORK_NAME: ${NETWORK:-ArkConstellation Devnet}
      NEXT_PUBLIC_NETWORK_SHORT_NAME: "Ark Devnet"
      NEXT_PUBLIC_NETWORK_ID: "${CHAIN_ID:-9000}"
      NEXT_PUBLIC_NETWORK_CURRENCY_NAME: ${COIN:-KASH}
      NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL: ${COIN:-KASH}
      NEXT_PUBLIC_NETWORK_CURRENCY_DECIMALS: "18"
      NEXT_PUBLIC_IS_TESTNET: "true"
      NEXT_PUBLIC_NETWORK_RPC_URL: ${NEXT_PUBLIC_NETWORK_RPC_URL:-http://127.0.0.1:8545}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  blockscout-db-data:
