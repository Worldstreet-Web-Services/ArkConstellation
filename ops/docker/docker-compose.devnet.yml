# docker-compose.devnet.yml — 4-node ArkConstellation devnet with monitoring
#
# Sentry Node Architecture:
#   sentry-0 <--> validator-0  (validator peers ONLY with its sentry)
#   sentry-1 <--> validator-1  (validator peers ONLY with its sentry)
#   sentry-0 <--> sentry-1     (public relay tier)
#
# Usage:
#   1. Start the devnet (builds image + runs genesis setup):
#      docker compose -f ops/docker/docker-compose.devnet.yml up -d
#   2. Check node status:
#      curl -s http://127.0.0.1:26657/status | jq '.result.node_info'
#   3. View logs:
#      docker compose -f ops/docker/docker-compose.devnet.yml logs -f
#   4. Access monitoring:
#      Grafana:       http://localhost:3000 (admin / arkconstellation)
#      Prometheus:    http://localhost:9092
#      AlertManager:  http://localhost:9093
#   5. Stop:
#      docker compose -f ops/docker/docker-compose.devnet.yml down -v
#
# MIN_GAS_PRICES is 1000000000esp (1 gwei), matching the chain-wide floor that
# cosmos/evm enforces through feemarket's min_gas_price. It was "0.01esp", which
# is not merely low but actively misleading: a node serves its local
# minimum-gas-prices over /cosmos/base/node/v1beta1/config, the standard endpoint
# wallets and CLIs query to auto-fill fees. Tooling asked what fee was needed, got
# 0.01esp, built a transaction at that price, and consensus rejected it with a
# 30-line ante-handler trace ending "provided fee < minimum global fee" — which
# reads like a chain fault rather than a fee five orders of magnitude too low.
#
# The local value is advisory and CheckTx-only; the feemarket value is consensus.
# Setting them equal is correct: no transaction that would pass consensus is
# dropped locally, and none that would fail wastes mempool space.
#
# Ports (sentries are the only publicly reachable nodes):
#   sentry-0:  P2P=26656  RPC=26657  LCD=1317  Prometheus=9090  gRPC=9095
#   sentry-1:  P2P=26676  RPC=26677  LCD=1318  Prometheus=9091  gRPC=9096
#   (validators have NO public ports)
#   Grafana:    3000
#   Prometheus: 9092
#   AlertManager: 9093

services:
  # -------------------------------------------------------------------
  # Genesis init — one-shot container that creates all keys, accounts,
  # gentxs, and the final genesis file. All node containers depend on it.
  # -------------------------------------------------------------------
  init:
    image: ${ARKD_IMAGE:-ghcr.io/worldstreet-web-services/arkd:ark-v1.0.1}
    build:
      context: ../../
      dockerfile: ops/docker/Dockerfile.node
    container_name: ark-init
    user: root
    entrypoint: ["/bin/sh", "/setup-devnet.sh"]
    environment:
      CHAIN_ID: arkdevnet_9000-1
      VALIDATOR_COUNT: "2"
      SENTRY_COUNT: "2"
      # Recovers the genesis-funded "faucet" account from this mnemonic so it
      # matches the faucet service's key below — otherwise the faucet service
      # would sign with an unfunded address.
      FAUCET_MNEMONIC: ${FAUCET_MNEMONIC:?FAUCET_MNEMONIC must be set in ops/docker/.env}
    volumes:
      - genesis-data:/config
    networks:
      - arkdevnet

  # -------------------------------------------------------------------
  # Sentry Node 0 — public relay tier (no signing key material)
  # -------------------------------------------------------------------
  sentry-0:
    image: ${ARKD_IMAGE:-ghcr.io/worldstreet-web-services/arkd:ark-v1.0.1}
    build:
      context: ../../
      dockerfile: ops/docker/Dockerfile.node
    container_name: ark-sentry-0
    restart: unless-stopped
    environment:
      NODE_ROLE: sentry
      SENTRY_INDEX: "0"
      CHAIN_ID: arkdevnet_9000-1
      MIN_GAS_PRICES: "1000000000esp"
      PROMETHEUS: "true"
      ENABLE_API: "true"
      ENABLE_EVM_RPC: "true"
    ports:
      - "26656:26656"   # P2P
      - "26657:26657"   # RPC
      - "1317:1317"     # Cosmos LCD/API
      - "9090:9090"     # Prometheus metrics (CometBFT)
      - "9095:9095"     # Cosmos gRPC — required by IBC relayers (Hermes)
      - "8545:8545"     # EVM JSON-RPC
      - "8546:8546"     # EVM WebSocket
      - "8100:8100"     # EVM geth metrics
    volumes:
      - sentry-0-data:/home/nonroot/.ark
      - genesis-data:/config:ro
    networks:
      - arkdevnet
    depends_on:
      init:
        condition: service_completed_successfully

  # -------------------------------------------------------------------
  # Validator 0 — signing node (NEVER publicly reachable)
  # -------------------------------------------------------------------
  validator-0:
    image: ${ARKD_IMAGE:-ghcr.io/worldstreet-web-services/arkd:ark-v1.0.1}
    build:
      context: ../../
      dockerfile: ops/docker/Dockerfile.node
    container_name: ark-validator-0
    restart: unless-stopped
    environment:
      NODE_ROLE: validator
      VALIDATOR_INDEX: "0"
      CHAIN_ID: arkdevnet_9000-1
      MIN_GAS_PRICES: "1000000000esp"
      PROMETHEUS: "true"
    # NO ports exposed — validator is never publicly reachable
    networks:
      - arkdevnet
    volumes:
      - validator-0-data:/home/nonroot/.ark
      - genesis-data:/config:ro
    depends_on:
      init:
        condition: service_completed_successfully

  # -------------------------------------------------------------------
  # Sentry Node 1 — public relay tier (no signing key material)
  # -------------------------------------------------------------------
  sentry-1:
    image: ${ARKD_IMAGE:-ghcr.io/worldstreet-web-services/arkd:ark-v1.0.1}
    build:
      context: ../../
      dockerfile: ops/docker/Dockerfile.node
    container_name: ark-sentry-1
    restart: unless-stopped
    environment:
      NODE_ROLE: sentry
      SENTRY_INDEX: "1"
      CHAIN_ID: arkdevnet_9000-1
      MIN_GAS_PRICES: "1000000000esp"
      PROMETHEUS: "true"
      ENABLE_API: "true"
      ENABLE_EVM_RPC: "true"
    ports:
      - "26676:26656"   # P2P
      - "26677:26657"   # RPC
      - "1318:1317"     # Cosmos LCD/API
      - "9091:9090"     # Prometheus metrics (CometBFT)
      - "9096:9095"     # Cosmos gRPC
      - "8555:8545"     # EVM JSON-RPC
      - "8556:8546"     # EVM WebSocket
      - "8101:8100"     # EVM geth metrics
    volumes:
      - sentry-1-data:/home/nonroot/.ark
      - genesis-data:/config:ro
    networks:
      - arkdevnet
    depends_on:
      init:
        condition: service_completed_successfully

  # -------------------------------------------------------------------
  # Validator 1 — signing node (NEVER publicly reachable)
  # -------------------------------------------------------------------
  validator-1:
    image: ${ARKD_IMAGE:-ghcr.io/worldstreet-web-services/arkd:ark-v1.0.1}
    build:
      context: ../../
      dockerfile: ops/docker/Dockerfile.node
    container_name: ark-validator-1
    restart: unless-stopped
    environment:
      NODE_ROLE: validator
      VALIDATOR_INDEX: "1"
      CHAIN_ID: arkdevnet_9000-1
      MIN_GAS_PRICES: "1000000000esp"
      PROMETHEUS: "true"
    networks:
      - arkdevnet
    volumes:
      - validator-1-data:/home/nonroot/.ark
      - genesis-data:/config:ro
    depends_on:
      init:
        condition: service_completed_successfully

  # -------------------------------------------------------------------
  # Faucet — developer self-serve test-fund dispenser (web form + API)
  # -------------------------------------------------------------------
  faucet:
    image: ark-faucet:local
    build:
      context: ../../
      dockerfile: ops/docker/faucet/Dockerfile
    container_name: ark-faucet
    restart: unless-stopped
    environment:
      CHAIN_ID: arkdevnet_9000-1
      NODE: http://sentry-0:26657
      AMOUNT_KASH: "10"
      DAILY_CAP_KASH: "50"
      FAUCET_MNEMONIC: ${FAUCET_MNEMONIC:?FAUCET_MNEMONIC must be set in ops/docker/.env}
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - faucet-data:/home/nonroot/.ark/faucet
    networks:
      - arkdevnet
    depends_on:
      sentry-0:
        condition: service_healthy

  # -------------------------------------------------------------------
  # Node Exporter — system metrics (CPU, RAM, disk, network)
  # Runs as a sidecar sharing the host's /proc and /sys for real metrics.
  # -------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: ark-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host/root'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    ports:
      - "9100:9100"
    networks:
      - arkdevnet

  # -------------------------------------------------------------------
  # Prometheus — metrics collection
  # -------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ark-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts/alerts.yml:/etc/prometheus/alerts/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9092:9090"
    networks:
      - arkdevnet

  # -------------------------------------------------------------------
  # Grafana — dashboards and visualization
  # -------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: ark-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: arkconstellation
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - arkdevnet
    depends_on:
      - prometheus

  # -------------------------------------------------------------------
  # AlertManager — alert routing and notification
  # -------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ark-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ../monitoring/alerts/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - arkdevnet

# -------------------------------------------------------------------
# Named volumes — persist node data across restarts
# -------------------------------------------------------------------
volumes:
  genesis-data:
  sentry-0-data:
  sentry-1-data:
  validator-0-data:
  validator-1-data:
  faucet-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:

# -------------------------------------------------------------------
# Network — all containers on a single bridge network
# Validators are only reachable from their sentries via Docker DNS
# -------------------------------------------------------------------
networks:
  arkdevnet:
    driver: bridge
